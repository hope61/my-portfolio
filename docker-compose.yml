services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-portfolio
    ports:
      - '${FRONTEND_PORT:-3002}:3000'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - portfolio-network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - '${BACKEND_PORT:-5437}:8000'
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PVE_HOST=${PVE_HOST}
      - PVE_NODE=${PVE_NODE}
      - PVE_TOKEN_ID=${PVE_TOKEN_ID}
      - PVE_TOKEN_SECRET=${PVE_TOKEN_SECRET}
      - PVE_CA_PATH=${PVE_CA_PATH:-}
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-true}
      - PVE_STORAGE=${PVE_STORAGE:-}
      - STATS_CACHE_SECONDS=${STATS_CACHE_SECONDS:-30}
      - CORS_EXTRA_ORIGINS=${CORS_EXTRA_ORIGINS:-}
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

